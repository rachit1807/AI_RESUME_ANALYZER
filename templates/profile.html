{% extends 'base.html' %}{% block title %}Candidate profile{% endblock %}{% block content %}<section class="page-heading"><p class="eyebrow">YOUR PROFILE</p><h1>Keep your profile current.</h1><p class="lead">Your details help personalize career tools and applications.</p></section><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Full name<input name="name" value="{{ g.user.name }}" maxlength="120" required></label><label>Professional headline<input name="headline" value="{{ g.user.profile.headline if g.user.profile else '' }}" maxlength="180" placeholder="Backend developer · Python · APIs"></label><label>Location<input name="location" value="{{ g.user.profile.location if g.user.profile else '' }}" maxlength="120"></label><label>Phone<input name="phone" value="{{ g.user.profile.phone if g.user.profile else '' }}" maxlength="40"></label><label>Skills<textarea name="skills" rows="3" maxlength="2000">{{ g.user.profile.skills if g.user.profile else '' }}</textarea></label><label>Salary expectation (optional)<input name="salary_expectation" value="{{ g.user.profile.salary_expectation if g.user.profile else '' }}" maxlength="80" placeholder="Your own target range / currency"></label><label>LinkedIn URL<input type="url" name="linkedin_url" value="{{ g.user.profile.linkedin_url if g.user.profile else '' }}" placeholder="https://www.linkedin.com/in/…"></label><label>GitHub URL<input type="url" name="github_url" value="{{ g.user.profile.github_url if g.user.profile else '' }}" placeholder="https://github.com/…"></label></div><button class="button button-primary" type="submit">Save profile</button></form></section>{% endblock %}
